<div class="sidebar">
  <p class="sidebar-label">Menú</p>

  <a class="sidebar-item" routerLink="/dashboard" routerLinkActive="active">
    <svg class="sidebar-icon" viewBox="0 0 16 16" fill="none">
      <rect x="2" y="2" width="5" height="5" rx="1" fill="currentColor"/>
      <rect x="9" y="2" width="5" height="5" rx="1" fill="rgba(255,255,255,0.4)"/>
      <rect x="2" y="9" width="5" height="5" rx="1" fill="rgba(255,255,255,0.4)"/>
      <rect x="9" y="9" width="5" height="5" rx="1" fill="rgba(255,255,255,0.4)"/>
    </svg>
    Mis documentos
  </a>

  <a class="sidebar-item" routerLink="/profile" routerLinkActive="active">
    <svg class="sidebar-icon" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/>
      <path d="M2 14c0-3 2.7-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Perfil
  </a>

  @if (role === 'ADMIN') {
    <p class="sidebar-label" style="margin-top: 16px;">Admin</p>
    <a class="sidebar-item" routerLink="/admin/users" routerLinkActive="active">
      <svg class="sidebar-icon" viewBox="0 0 16 16" fill="none">
        <circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M1 14c0-2.5 2.2-4 5-4s5 1.5 5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M12 7v4M14 9h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Usuarios
    </a>
  }
</div>
