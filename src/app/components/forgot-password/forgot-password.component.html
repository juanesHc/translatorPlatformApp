<div class="wrapper">
  <div class="card">
    <div class="brand">TranslatorPlatform</div>
    <h2 class="title">¿Olvidaste tu contraseña?</h2>
    <p class="subtitle">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>

    @if (errorMessage) {
      <div class="error-banner">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="success-banner">{{ successMessage }}</div>
    }

    @if (!successMessage) {
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" placeholder="tu@correo.com" [(ngModel)]="email" />
      </div>

      <button class="btn-primary" (click)="sendResetEmail()" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    }

    <a class="back-link" routerLink="/login">← Volver al inicio de sesión</a>
  </div>
</div>
