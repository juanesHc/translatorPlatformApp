<div class="field">
  <label>Nueva contraseña</label>
  <input type="password" 
    placeholder="Mínimo 8 caracteres" 
    [(ngModel)]="newPassword" />

  @if (newPassword.length > 0) {
    <div class="strength-bar-wrapper">
      <div class="strength-bar">
        <div class="strength-fill" 
          [style.width]="strengthWidth"
          [style.background]="strengthColor">
        </div>
      </div>
      <span class="strength-label" [style.color]="strengthColor">
        {{ strengthLabel }}
      </span>
    </div>

    <ul class="password-rules">
      <li [class.valid]="/[A-Z]/.test(newPassword)">Una letra mayúscula</li>
      <li [class.valid]="/[a-z]/.test(newPassword)">Una letra minúscula</li>
      <li [class.valid]="/[0-9]/.test(newPassword)">Un número</li>
      <li [class.valid]="/[^A-Za-z0-9]/.test(newPassword)">Un carácter especial</li>
      <li [class.valid]="newPassword.length >= 8">Mínimo 8 caracteres</li>
    </ul>
  }
</div>

<div class="field">
  <label>Confirmar contraseña</label>
  <input type="password" 
    placeholder="Repite la contraseña" 
    [(ngModel)]="confirmPassword"
    [class.input-error]="passwordsMismatch"
    [class.input-success]="passwordsMatch" />

  @if (passwordsMismatch) {
    <span class="field-error">Las contraseñas no coinciden</span>
  }
  @if (passwordsMatch) {
    <span class="field-success">Las contraseñas coinciden ✓</span>
  }
</div>
