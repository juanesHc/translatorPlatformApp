<div class="auth-wrapper">
  <div class="card">
    <div class="card-header">
      <p class="logo">TranslatorPlatform</p>
      <p class="subtitle">Regístrate para empezar a traducir</p>
    </div>

    @if (errorMessage) {
      <div class="error-banner">{{ errorMessage }}</div>
    }

    <div class="form-fields">
      <div class="field-row">
        <div class="field">
          <label>Nombre</label>
          <input type="text" placeholder="Juan" [(ngModel)]="givenName" />
        </div>
        <div class="field">
          <label>Apellido</label>
          <input type="text" placeholder="Herrera" [(ngModel)]="familyName" />
        </div>
      </div>

      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" placeholder="tu@correo.com" [(ngModel)]="email" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>Contraseña</label>
          <div class="input-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" [(ngModel)]="password" />
            <button class="eye-btn" (click)="showPassword = !showPassword" type="button">
              @if (showPassword) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M3 3l18 18" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
                  <circle cx="12" cy="12" r="3" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <div class="field">
          <label>Confirmar contraseña</label>
          <div class="input-wrapper">
            <input [type]="showConfirmPassword ? 'text' : 'password'" placeholder="••••••••" [(ngModel)]="confirmPassword" />
            <button class="eye-btn" (click)="showConfirmPassword = !showConfirmPassword" type="button">
              @if (showConfirmPassword) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M3 3l18 18" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
                  <circle cx="12" cy="12" r="3" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
                </svg>
              }
            </button>
          </div>
        </div>
      </div>

      @if (password.length > 0) {
        <div class="strength-wrapper">
          <div class="strength-bar">
            <div class="strength-fill" [style.width]="strengthWidth" [style.background]="strengthColor"></div>
          </div>
          <span class="strength-label" [style.color]="strengthColor">{{ strengthLabel }}</span>
        </div>
      }
    </div>

    <button class="btn-primary" (click)="register()">Crear cuenta</button>

    <p class="switch-text">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
    <p class="switch-text" style="margin-top:6px;">
      ¿Qué es TranslatorPlatform? <a routerLink="/about">Conoce más</a>
    </p>
  </div>
</div>
